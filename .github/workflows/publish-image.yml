name: Publish image

# Builds the Spines container and pushes it to ghcr.io/zot24/spines for
# linux/amd64 and linux/arm64. Runs in this repo so it can push with the
# built-in GITHUB_TOKEN. The Umbrel app pins the digest of that image.
#
# Triggers:
#   - pushing a release tag vX.Y.Z
#   - a manual run, which takes a version input

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, for example 0.1.0. Required for a manual run."
        required: false
        default: ""
        type: string
      platforms:
        description: "Build platforms."
        required: false
        default: "linux/amd64,linux/arm64"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          INPUT='${{ inputs.version }}'
          if [ -n "$INPUT" ]; then
            V="${INPUT#v}"
          elif printf '%s' "${GITHUB_REF_NAME:-}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            V="${GITHUB_REF_NAME#v}"
          else
            echo "::error::No version. Push a vX.Y.Z tag or pass the version input."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building ghcr.io/zot24/spines:$V"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: |
            ghcr.io/zot24/spines:${{ steps.version.outputs.version }}
            ghcr.io/zot24/spines:latest
          labels: |
            org.opencontainers.image.source=https://github.com/zot24/spines
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make the package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method PUT -H "Accept: application/vnd.github+json" \
            /user/packages/container/spines/visibility \
            -f visibility=public

      - name: Summary
        run: |
          echo "Pushed **ghcr.io/zot24/spines:${{ steps.version.outputs.version }}** and **latest**." >> "$GITHUB_STEP_SUMMARY"
