[package]
name = "spines"
version = "0.1.0"
edition = "2021"
description = "Self-hosted media library. One binary, plugins for each shelf."
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.25"
regex = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
filetime = "0.2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal"] }
url = "2"
utoipa = { version = "6", features = ["macros", "axum_extras"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
